<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script type="module" src="https://cdn.jsdelivr.net/npm/iconify-icon@2.2.0/dist/iconify-icon.min.js"></script>
		<script>
			// Resolve the theme before first paint so the app never flashes light-on-dark.
			(function () {
				try {
					var stored = localStorage.getItem('perception.theme');
					var dark =
						stored === 'dark' ||
						((!stored || stored === 'system') &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.classList.toggle('light', !dark);
				} catch (e) {}
			})();
		</script>

		<title>Perception · The context brain for operations</title>
		<meta name="description" content="Ingests events from across the suite, keeps a business memory and answers operational questions in plain words." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Facile" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:url" content="https://perception.facile.studio/" />
		<meta property="og:title" content="Perception · The context brain for operations" />
		<meta property="og:description" content="Ingests events from across the suite, keeps a business memory and answers operational questions in plain words." />
		<meta property="og:image" content="https://perception.facile.studio/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Perception: The context brain for operations" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Perception · The context brain for operations" />
		<meta name="twitter:description" content="Ingests events from across the suite, keeps a business memory and answers operational questions in plain words." />
		<meta name="twitter:image" content="https://perception.facile.studio/og-image.png" />

		<meta name="color-scheme" content="light dark" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
