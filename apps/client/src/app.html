<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Perception</title>
		<meta name="description" content="Perception — operational context brain by Facile Studio." />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
		<link rel="preload" href="%sveltekit.assets%/fonts/GogaTest-Medium-BF6646d5d84754e.otf" as="font" type="font/otf" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/GogaTest-Semibold-BF6646d5d8544cf.otf" as="font" type="font/otf" crossorigin />
		<script type="module" src="https://cdn.jsdelivr.net/npm/iconify-icon@2.2.0/dist/iconify-icon.min.js"></script>
		<script>
			// Resolve the theme before first paint so the app never flashes light-on-dark.
			(function () {
				try {
					var stored = localStorage.getItem('perception.theme');
					var dark =
						stored === 'dark' ||
						((!stored || stored === 'system') &&
							window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
