services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "8787"
    volumes:
      - perception_data:/app/data
    env_file:
      - .env
    environment:
      - PERCEPTION_DATABASE_URL=file:/app/data/perception.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    expose:
      - "3000"
    environment:
      - API_UPSTREAM=http://api:8787
      - ORIGIN=${CLIENT_ORIGIN:-https://perception.facile.studio}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  perception_data:
