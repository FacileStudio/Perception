services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
    expose:
      - "8787"
    volumes:
      - perception_data:/app/data
    env_file:
      - .env
    environment:
      - PERCEPTION_DATABASE_URL=file:/app/data/perception.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      network: host
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  perception_data:
